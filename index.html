<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f8fd;
    --line:#d3def1;
    --ink:#1b3a8f;
    --ink-soft:#55689f;
    --ok:#157a42;
    --ok-bg:#dcf2e5;
    --bad:#cf2f28;
    --bad-bg:#fde2df;
    --margin:#f1a6a6;
    --font:"Be Vietnam Pro","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{
    min-height:100vh;
    font-family:var(--font);
    color:var(--ink);
    background-color:var(--paper);
    /* nền giấy ô ly */
    background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:28px 28px;
  }
  .wrap{max-width:960px;margin:0 auto;padding:20px 20px 28px}
  @media (max-width:640px){ .wrap{padding:16px 14px 24px} }

  header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;margin-bottom:16px}
  h1{margin:0;font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .hint{margin:6px auto 0;color:var(--ink-soft);font-size:1rem;max-width:44ch}
  .stats{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
  .stat{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:6px 12px;font-weight:600;font-size:1rem;white-space:nowrap}
  .stat b{font-weight:800;font-size:1.25rem}
  .stat.ok{color:var(--ok);border-color:var(--ok)}
  .reset{font:inherit;font-weight:600;color:var(--ink);background:transparent;border:2px dashed var(--ink-soft);border-radius:8px;padding:8px 14px;cursor:pointer}
  .reset:hover{background:#fff}

  button:focus-visible{outline:4px solid #f5b400;outline-offset:3px}

  /* ---------- bảng ---------- */
  .board{
    display:grid;grid-template-columns:repeat(5,1fr);gap:10px;
    width:min(100%,calc(100vh - 290px));min-width:260px;margin:0 auto;
  }
  .cell{
    position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font:inherit;font-weight:800;font-size:clamp(1.5rem,5.2vw,3rem);
    color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:10px;
    box-shadow:3px 3px 0 var(--ink);cursor:pointer;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .cell:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
  .cell:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .cell .tag{font-size:clamp(.7rem,1.6vw,1rem);font-weight:600;line-height:1;margin-top:2px;min-height:1em}
  .cell.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok);box-shadow:3px 3px 0 var(--ok);cursor:default}
  .cell.ok .tag{font-size:clamp(1rem,2.4vw,1.5rem);font-weight:800}
  .cell.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad);box-shadow:3px 3px 0 var(--bad)}
  .cell.bad:hover:not(.locked){box-shadow:5px 5px 0 var(--bad)}
  .cell.locked{cursor:not-allowed;background-image:repeating-linear-gradient(135deg,transparent 0 9px,rgba(207,47,40,.12) 9px 11px)}
  .cell.locked:hover{transform:none;box-shadow:3px 3px 0 var(--bad)}

  .toast{min-height:2.6em;margin:14px 0 0;text-align:center;font-weight:600;color:var(--bad)}
  .toast.done{color:var(--ok);font-size:1.15rem}

  /* ---------- câu hỏi ---------- */
  .card{max-width:860px;margin:0 auto;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink);padding:clamp(18px,3vw,32px)}
  .qhead{display:flex;align-items:center;justify-content:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px;text-align:left}
  .qnum{flex:none;min-width:3.4rem;height:3.4rem;padding:0 10px;display:flex;align-items:center;justify-content:center;
        font-weight:800;font-size:1.8rem;color:#fff;background:var(--ink);border-radius:10px}
  .qlabel{color:var(--ink-soft);font-weight:600}
  .qtext{margin:0 0 20px;text-align:left;font-size:clamp(1.4rem,3.2vw,2.2rem);font-weight:800;line-height:1.25;letter-spacing:-.01em}
  .options{display:grid;gap:12px;grid-template-columns:1fr 1fr}
  @media (max-width:640px){.options{grid-template-columns:1fr}}
  .opt{
    display:flex;align-items:center;gap:14px;text-align:left;width:100%;
    font:inherit;font-weight:600;font-size:clamp(1.1rem,2.4vw,1.6rem);color:var(--ink);
    background:#fff;border:3px solid var(--ink);border-radius:10px;padding:14px 16px;cursor:pointer;
  }
  .opt:hover:not(:disabled){background:#eef3ff}
  .opt .letter{flex:none;width:2.2rem;height:2.2rem;border-radius:50%;border:2.5px solid currentColor;
               display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem}
  .opt:disabled{cursor:default}
  .opt .mark{margin-left:auto;flex:none;font-weight:800;font-size:1.6em;line-height:1}
  .banner:empty{display:none}
  .opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .opt.dim{opacity:.45}

  .result{margin-top:20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
  .banner{font-weight:800;font-size:clamp(1.1rem,2.4vw,1.5rem);line-height:1.3}
  .banner small{display:block;font-weight:600;font-size:1rem;margin-top:2px}
  .banner.ok{color:var(--ok)}
  .banner.bad{color:var(--bad)}
  .back{font:inherit;font-weight:800;font-size:1.2rem;color:#fff;background:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:12px 22px;cursor:pointer}
  .back:hover{background:#142c70}

  .overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(20,36,90,.45);padding:16px}
  .dialog{background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink);padding:24px;max-width:420px;width:100%}
  .dialog p{margin:0 0 18px;font-weight:800;font-size:1.25rem;line-height:1.3}
  .dlgBtns{display:flex;gap:12px;flex-wrap:wrap}
  .hidden{display:none !important}
  .error{background:#fff3cd;border:2px solid #b58900;color:#5c4400;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-weight:600}

  @media (prefers-reduced-motion:reduce){.cell{transition:none}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1 id="title">Bingo</h1>
      <p class="hint">Chọn một ô và trả lời. Đúng thì cả lớp khoanh số đó trên bảng của mình.</p>
    </div>
    <div class="stats">
      <span class="stat ok">Đúng <b id="cOk">0</b>/25</span>
      <button class="reset" id="resetBtn" type="button">Chơi lại</button>
    </div>
  </header>

  <div id="error" class="error hidden"></div>

  <div id="confirmBox" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="confirmText">
    <div class="dialog">
      <p id="confirmText">Chơi lại từ đầu? Toàn bộ kết quả hiện tại sẽ bị xóa.</p>
      <div class="dlgBtns">
        <button class="back" id="confirmYes" type="button">Chơi lại</button>
        <button class="reset" id="confirmNo" type="button">Hủy</button>
      </div>
    </div>
  </div>

  <!-- Trang chủ: bảng 5x5 -->
  <section id="boardView">
    <div class="board" id="board" role="group" aria-label="Bảng 25 ô"></div>
    <p class="toast" id="toast" role="status" aria-live="polite"></p>
  </section>

  <!-- Trang câu hỏi -->
  <section id="questionView" class="hidden">
    <div class="card">
      <div class="qhead">
        <span class="qnum" id="qNum">1</span>
        <span class="qlabel">Chọn một đáp án (hoặc bấm phím A, B, C, D)</span>
      </div>
      <h2 class="qtext" id="qText"></h2>
      <div class="options" id="options"></div>
      <div class="result hidden" id="result">
        <div class="banner" id="banner" role="status" aria-live="polite"></div>
        <button class="back" id="backBtn" type="button">Về bảng</button>
      </div>
    </div>
  </section>

</div>

<script>
/* =====================================================================
   PHẦN CHỈNH SỬA — thầy/cô/bạn chỉ cần sửa ở đây
   ===================================================================== */

const CONFIG = {
  TITLE: "Bingo",   // tiêu đề trên đầu trang
  LOCK_AFTER_WRONG: 1,      // ô đỏ phải chờ chọn thêm bao nhiêu ô khác rồi mới được thử lại
  SHUFFLE_LAYOUT: true      // true: mỗi ván xáo lại vị trí các số trên bảng
};

/* Đúng 25 câu. Câu thứ n trong danh sách = ô số n.
   q: câu hỏi | options: 4 đáp án (A, B, C, D) | answer: vị trí đáp án đúng
   (0 = A, 1 = B, 2 = C, 3 = D)                                            */
const QUESTIONS = [
  { q: "Thủ đô của Việt Nam là thành phố nào?", options: ["Hà Nội","Huế","Đà Nẵng","Hải Phòng"], answer: 0 },
  { q: "Đỉnh núi nào cao nhất Việt Nam?", options: ["Pu Ta Leng","Fansipan","Bạch Mã","Ngọc Linh"], answer: 1 },
  { q: "Hành tinh nào gần Mặt Trời nhất?", options: ["Sao Kim","Sao Hỏa","Sao Thủy","Trái Đất"], answer: 2 },
  { q: "15 × 4 bằng bao nhiêu?", options: ["45","65","80","60"], answer: 3 },
  { q: "Ai là tác giả của Truyện Kiều?", options: ["Nguyễn Du","Nguyễn Trãi","Hồ Xuân Hương","Nguyễn Đình Chiểu"], answer: 0 },
  { q: "Quốc gia nào có diện tích lớn nhất thế giới?", options: ["Canada","Nga","Trung Quốc","Hoa Kỳ"], answer: 1 },
  { q: "Công thức hóa học của nước là gì?", options: ["CO₂","O₂","H₂O","NaCl"], answer: 2 },
  { q: "Vịnh Hạ Long thuộc tỉnh nào?", options: ["Hải Phòng","Thanh Hóa","Nghệ An","Quảng Ninh"], answer: 3 },
  { q: "Ngày Quốc khánh của Việt Nam là ngày nào?", options: ["2/9","30/4","19/8","1/5"], answer: 0 },
  { q: "Chiến thắng Điện Biên Phủ diễn ra vào năm nào?", options: ["1945","1954","1968","1975"], answer: 1 },
  { q: "Loài động vật nào lớn nhất trong các loài sống trên cạn?", options: ["Tê giác","Hà mã","Voi châu Phi","Hươu cao cổ"], answer: 2 },
  { q: "Đại dương nào lớn nhất thế giới?", options: ["Đại Tây Dương","Ấn Độ Dương","Bắc Băng Dương","Thái Bình Dương"], answer: 3 },
  { q: "Ai là người đề xuất thuyết tương đối?", options: ["Albert Einstein","Isaac Newton","Galileo Galilei","Nikola Tesla"], answer: 0 },
  { q: "Số nguyên tố nhỏ nhất là số nào?", options: ["0","1","2","3"], answer: 2 },
  { q: "Tháp Eiffel nằm ở thành phố nào?", options: ["Luân Đôn","Paris","Rome","Berlin"], answer: 1 },
  { q: "Cơ quan nào bơm máu đi khắp cơ thể?", options: ["Phổi","Gan","Thận","Tim"], answer: 3 },
  { q: "Việt Nam gia nhập ASEAN vào năm nào?", options: ["1995","1986","2007","2000"], answer: 0 },
  { q: "Cây xanh hấp thụ khí nào để quang hợp?", options: ["Ô-xi","Ni-tơ","Các-bô-níc (CO₂)","Hi-đrô"], answer: 2 },
  { q: "Mỗi đội bóng đá có bao nhiêu cầu thủ trên sân (tính cả thủ môn)?", options: ["9","10","12","11"], answer: 3 },
  { q: "Đàn bầu truyền thống của Việt Nam có mấy dây?", options: ["1 dây","2 dây","3 dây","4 dây"], answer: 0 },
  { q: "Kim loại nào ở thể lỏng ở nhiệt độ phòng?", options: ["Nhôm","Thủy ngân","Đồng","Sắt"], answer: 1 },
  { q: "Châu lục nào có diện tích lớn nhất?", options: ["Châu Phi","Châu Mỹ","Châu Á","Châu Âu"], answer: 2 },
  { q: "Ai là người đầu tiên đặt chân lên Mặt Trăng?", options: ["Yuri Gagarin","Buzz Aldrin","Michael Collins","Neil Armstrong"], answer: 3 },
  { q: "Nước nguyên chất sôi ở bao nhiêu độ C (áp suất thường)?", options: ["90°C","100°C","110°C","120°C"], answer: 1 },
  { q: "Tên cũ của Thành phố Hồ Chí Minh là gì?", options: ["Sài Gòn","Thăng Long","Phú Xuân","Đông Đô"], answer: 0 }
];

/* =====================================================================
   PHẦN CHẠY GAME — không cần sửa
   ===================================================================== */

const SIZE = 25;
const LETTERS = ["A","B","C","D"];
const $ = id => document.getElementById(id);

let layout, status, lock, current, answered, toastTimer;

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function checkData(){
  const errs=[];
  if(QUESTIONS.length!==SIZE) errs.push("Cần đúng "+SIZE+" câu hỏi, hiện có "+QUESTIONS.length+".");
  QUESTIONS.forEach((x,i)=>{
    if(!x || !Array.isArray(x.options) || x.options.length!==4) errs.push("Câu "+(i+1)+" cần đúng 4 đáp án.");
    else if(![0,1,2,3].includes(x.answer)) errs.push("Câu "+(i+1)+": answer phải là 0, 1, 2 hoặc 3.");
  });
  const box=$("error");
  if(errs.length){ box.textContent=errs.join(" "); box.classList.remove("hidden"); return false; }
  box.classList.add("hidden"); return true;
}

function newGame(){
  document.title=CONFIG.TITLE;
  $("title").textContent=CONFIG.TITLE;
  if(!checkData()) return;
  layout=[...Array(SIZE).keys()];
  if(CONFIG.SHUFFLE_LAYOUT) shuffle(layout);
  status=Array(SIZE).fill("new");
  lock=Array(SIZE).fill(0);
  current=null; answered=false;
  showBoard();
}

function showBoard(){
  $("questionView").classList.add("hidden");
  $("boardView").classList.remove("hidden");
  renderBoard();
  window.scrollTo(0,0);
}

function renderBoard(){
  const board=$("board");
  board.innerHTML="";
  layout.forEach(idx=>{
    const b=document.createElement("button");
    b.type="button";
    const tag=document.createElement("span"); tag.className="tag";
    const num=document.createElement("span"); num.textContent=idx+1;
    if(status[idx]==="ok"){
      b.className="cell ok"; tag.textContent="✓";
      b.setAttribute("aria-label","Ô "+(idx+1)+", đã đúng");
    } else if(status[idx]==="bad" && lock[idx]>0){
      b.className="cell bad locked";
      b.setAttribute("aria-label","Ô "+(idx+1)+", sai, đang chờ");
    } else {
      b.className="cell new";
      b.setAttribute("aria-label","Ô "+(idx+1));
    }
    b.append(num,tag);
    b.addEventListener("click",()=>onCell(idx));
    board.appendChild(b);
  });
  const okCount=status.filter(s=>s==="ok").length;
  $("cOk").textContent=okCount;
  if(okCount===SIZE) showToast("Đã mở hết 25 ô. Bấm “Chơi lại” để bắt đầu ván mới.",true,0);
}

function showToast(msg,done,ms){
  const t=$("toast");
  t.textContent=msg; t.className="toast"+(done?" done":"");
  clearTimeout(toastTimer);
  if(ms) toastTimer=setTimeout(()=>{t.textContent="";},ms);
}

function onCell(idx){
  if(status[idx]==="ok") return;
  if(status[idx]==="bad" && lock[idx]>0){
    showToast("Ô "+(idx+1)+" đang chờ. Chọn thêm "+lock[idx]+" ô khác rồi mới thử lại được.",false,3500);
    return;
  }
  openQuestion(idx);
}

function openQuestion(idx){
  // mở một ô khác thì các ô đỏ đang chờ được giảm 1 lượt chờ
  for(let i=0;i<SIZE;i++){ if(i!==idx && lock[i]>0) lock[i]--; }
  current=idx; answered=false;
  const q=QUESTIONS[idx];
  $("qNum").textContent=idx+1;
  $("qText").textContent=q.q;
  const box=$("options"); box.innerHTML="";
  q.options.forEach((text,i)=>{
    const b=document.createElement("button");
    b.type="button"; b.className="opt";
    const l=document.createElement("span"); l.className="letter"; l.textContent=LETTERS[i];
    const t=document.createElement("span"); t.textContent=text;
    b.append(l,t);
    b.addEventListener("click",()=>answer(i));
    box.appendChild(b);
  });
  $("result").classList.add("hidden");
  $("boardView").classList.add("hidden");
  $("questionView").classList.remove("hidden");
  window.scrollTo(0,0);
}

function answer(choice){
  if(answered || current===null) return;
  answered=true;
  const q=QUESTIONS[current];
  const correct=(choice===q.answer);
  const btns=[...document.querySelectorAll("#options .opt")];
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===choice) b.classList.add(correct?"right":"wrong");
    else b.classList.add("dim");
  });
  const banner=$("banner");
  banner.className="banner"; banner.textContent="";
  if(correct){ status[current]="ok"; lock[current]=0; }
  else { status[current]="bad"; lock[current]=CONFIG.LOCK_AFTER_WRONG; }
  const mk=document.createElement("span"); mk.className="mark";
  mk.textContent=correct?"✓":"✕";
  mk.setAttribute("aria-label",correct?"Đúng":"Sai");
  btns[choice].appendChild(mk);
  // nếu tất cả ô còn lại đều đang chờ thì mở khóa để game không bị kẹt
  const remaining=[]; for(let i=0;i<SIZE;i++) if(status[i]!=="ok") remaining.push(i);
  if(remaining.length && remaining.every(i=>lock[i]>0)){ remaining.forEach(i=>lock[i]=0); }
  $("result").classList.remove("hidden");
  $("backBtn").focus();
}

function backToBoard(){
  if(!answered) return;
  current=null; showBoard();
}

$("backBtn").addEventListener("click",backToBoard);
function openConfirm(){ $("confirmBox").classList.remove("hidden"); $("confirmNo").focus(); }
function closeConfirm(){ $("confirmBox").classList.add("hidden"); $("resetBtn").focus(); }
$("resetBtn").addEventListener("click",openConfirm);
$("confirmNo").addEventListener("click",closeConfirm);
$("confirmYes").addEventListener("click",()=>{ $("confirmBox").classList.add("hidden"); newGame(); });
$("confirmBox").addEventListener("click",e=>{ if(e.target===$("confirmBox")) closeConfirm(); });

document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(!$("confirmBox").classList.contains("hidden")){ if(e.key==="Escape") closeConfirm(); return; }
  if($("questionView").classList.contains("hidden")) return;
  const k=e.key.toLowerCase();
  if(!answered){
    const i=["a","b","c","d"].indexOf(k);
    const j=["1","2","3","4"].indexOf(k);
    const pick=i>-1?i:j;
    if(pick>-1){ e.preventDefault(); answer(pick); }
  } else if(k==="escape"){ backToBoard(); }
});

newGame();
</script>
</body>
</html>
